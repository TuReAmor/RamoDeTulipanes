
name: Crear regalo para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar PyInstaller
        run: |
          python -m pip install pyinstaller

      - name: Crear ejecutable
        run: |
          pyinstaller --onefile --windowed --name "ParaMiAmor" tulipanes/tulipanes.py

      - name: Guardar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: ParaMiAmor-Windows
          path: dist/ParaMiAmor.exe
          retention-days: 30
